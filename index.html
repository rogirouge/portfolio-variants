<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Какой вариант лучше?</title>
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: #1c1c1c;
      color: #eee;
      font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: #111;
      border-bottom: 1px solid #333;
    }
    .bar button, .bar a {
      padding: 7px 11px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #222;
      color: #ddd;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .bar button:hover, .bar a:hover { border-color: #888; color: #fff; }
    .bar button.on { background: #eee; border-color: #eee; color: #111; font-weight: 600; }
    .bar .key { opacity: .55; margin-right: 4px; }
    .bar .on .key { opacity: .7; }
    .spacer { flex: 1; }
    .note { color: #888; padding: 0 6px; }
    .ask { padding: 0 8px 0 4px; font-weight: 600; }
    @media (max-width: 1300px) { .note { display: none; } }
    @media (max-width: 1100px) { .ask { display: none; } }
    /* на телефоне кнопки листаются в одну строку */
    @media (max-width: 700px) {
      .bar { flex-wrap: nowrap; overflow-x: auto; padding: 6px; gap: 5px; }
      #variants { display: flex; gap: 5px; }
      .bar button, .bar a { padding: 6px 9px; font-size: 13px; }
      #desktop, #phone, .spacer { display: none; }
    }
    .stage { flex: 1; display: flex; justify-content: center; min-height: 0; }
    iframe { flex: 1; width: 100%; border: 0; background: #000; }
    .phone .stage { align-items: center; padding: 16px; }
    .phone iframe { flex: none; width: 390px; height: min(844px, 100%); border: 1px solid #444; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="bar">
    <strong class="ask">Какой вариант сайта лучше?</strong>
    <span id="variants"></span>
    <span class="spacer"></span>
    <span class="note">1–7, ← →</span>
    <button id="desktop" class="on">Компьютер</button>
    <button id="phone">Телефон</button>
    <a id="alone" target="_blank" rel="noopener">Открыть отдельно ↗</a>
  </div>
  <div class="stage"><iframe id="view" title="Вариант сайта"></iframe></div>

  <script>
    var variants = [
      { id: 'couloir', name: 'Коридор', note: 'на сайте' },
      { id: 'rouge', name: 'Красный' },
      { id: 'labo', name: 'Лаборатория' },
      { id: 'sombre', name: 'Тёмный смешанный' },
      { id: 'v2', name: 'В стиле v2' },
      { id: 'papier', name: 'Бумажный' },
      { id: 'premier', name: 'Самый первый' }
    ];
    var view = document.getElementById('view');
    var box = document.getElementById('variants');
    var current = -1;
    var pendingScroll = 0;

    variants.forEach(function (v, i) {
      var b = document.createElement('button');
      b.innerHTML = '<span class="key">' + (i + 1) + '</span>' + v.name + (v.note ? ' · ' + v.note : '');
      b.addEventListener('click', function () { show(i); });
      box.appendChild(b);
    });

    // на какой доле страницы мы сейчас: при переключении откроем новый вариант примерно там же
    function scrollFraction() {
      try {
        var w = view.contentWindow, d = w.document.documentElement;
        var max = d.scrollHeight - w.innerHeight;
        return max > 0 ? w.scrollY / max : 0;
      } catch (e) { return 0; }
    }

    function show(i) {
      i = (i + variants.length) % variants.length;
      if (i === current) return;
      if (current >= 0) pendingScroll = scrollFraction();
      current = i;
      var v = variants[i];
      box.querySelectorAll('button').forEach(function (b, k) { b.classList.toggle('on', k === i); });
      view.src = v.id + '/';
      document.getElementById('alone').href = v.id + '/';
      history.replaceState(null, '', '#' + v.id);
      document.title = (i + 1) + ' · ' + v.name + ' — какой вариант лучше?';
    }

    view.addEventListener('load', function () {
      var w = view.contentWindow;
      try { w.document.addEventListener('keydown', onKey); } catch (e) { /* tant pis */ }
      if (!pendingScroll) return;
      // даём варианту разложить страницу (шрифты, высоты), потом прокручиваем
      setTimeout(function () {
        try {
          var d = w.document.documentElement;
          w.scrollTo({ top: pendingScroll * (d.scrollHeight - w.innerHeight), behavior: 'instant' });
        } catch (e) { /* tant pis */ }
      }, 400);
    });

    function onKey(e) {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= variants.length) show(n - 1);
      else if (e.key === 'ArrowLeft' && e.altKey === false && e.target === e.currentTarget.body) show(current - 1);
      else if (e.key === 'ArrowRight' && e.altKey === false && e.target === e.currentTarget.body) show(current + 1);
    }
    document.addEventListener('keydown', function (e) {
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= variants.length) show(n - 1);
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });

    function setDevice(phone) {
      document.body.classList.toggle('phone', phone);
      document.getElementById('phone').classList.toggle('on', phone);
      document.getElementById('desktop').classList.toggle('on', !phone);
    }
    document.getElementById('phone').addEventListener('click', function () { setDevice(true); });
    document.getElementById('desktop').addEventListener('click', function () { setDevice(false); });

    var start = variants.findIndex(function (v) { return '#' + v.id === location.hash; });
    show(start >= 0 ? start : 0);
  </script>
</body>
</html>
